# iOS app tests on PRs (TODO C2, D-alief-12).
name: iOS app

on:
  pull_request:
    # ready_for_review: a draft PR skips the suite (below), so it must run once the PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "ios/ShooApp/**"
      - "ios/ShooShared/**"
      - "ios/project.yml"
      - "contracts/fixtures/**"
      - ".github/workflows/ios-app.yml"

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Only 5 macOS runners: a draft PR does not take one on every push. Mark it ready to run the suite.
    if: github.event.pull_request.draft == false
    runs-on: macos-26 # Xcode 26.x: the app uses iOS 26.2 SDK APIs (SFSafariSettings)
    timeout-minutes: 45 # the suite takes about 32 minutes on this runner
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen

      - name: Pick a simulator
        id: sim
        run: |
          SIM=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+(e| Pro Max| Pro| Plus| mini| Air)?' | head -1)
          echo "name=$SIM" >> "$GITHUB_OUTPUT"

      # Unit tests also compare Data/Fixtures with contracts/fixtures, so the whole repo must be checked out.
      # Ad-hoc signing ("-", no team, no profile): the simulator still gets the entitlements, so the
      # Keychain tests work. CODE_SIGNING_ALLOWED=NO strips them and Keychain calls fail with -34018.
      # The full log is too long to read; keep its tail plus every assertion line, so a failing
      # test shows why it failed and not only its name. Each finished test is printed as it happens,
      # so a run that gets cancelled still shows how far it got and what took the time. The greps also match
      # the "Test case '…' passed on 'Clone 1 of …' (… seconds)" lines xcodebuild prints for parallel workers.
      # FigmaParityUITests only takes QA screenshots and is not a gate; it took 17 of the 47 test minutes.
      # A failing test runs once more before it fails the job, so one flaky run does not cost a whole new
      # 30-minute run; a test that fails twice still fails the job. No parallel workers: two cloned
      # simulators on this 3-CPU runner ran past the 45-minute limit (PR #401).
      # The step timeout stops the step before the job timeout does, so a slow run still keeps its log.
      - name: Test
        timeout-minutes: 40
        run: |
          set +e
          xcodebuild test \
            -project ios/Shoo.xcodeproj \
            -scheme Shoo \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -skip-testing:ShooAppUITests/FigmaParityUITests \
            -retry-tests-on-failure -test-iterations 2 \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee xcodebuild.log | grep --line-buffered -iE "^Test case .* (passed|failed|skipped) (on|\()"
          status=${PIPESTATUS[0]}
          set -e
          tail -40 xcodebuild.log
          echo "::group::Assertion failures"
          grep -E ": error: |\] failed \(|' failed on |recorded an issue|Expectation failed" xcodebuild.log | cut -c1-600 | head -60 || true
          echo "::endgroup::"
          exit $status
