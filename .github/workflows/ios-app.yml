# iOS app tests on PRs (TODO C2, D-alief-12). Built once, then unit and UI tests run side by side (#348).
name: iOS app

on:
  pull_request:
    # ready_for_review: a draft PR skips the suite (below), so it must run once the PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "ios/ShooApp/**"
      - "ios/ShooShared/**"
      - "ios/project.yml"
      - "contracts/fixtures/**"
      - ".github/workflows/ios-app.yml"

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Only 5 macOS runners: a draft PR does not take one on every push. Mark it ready to run the suite.
    if: github.event.pull_request.draft == false
    runs-on: macos-26 # Xcode 26.x: the app uses iOS 26.2 SDK APIs (SFSafariSettings)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen

      # Ad-hoc signing ("-", no team, no profile): the simulator still gets the entitlements, so the
      # Keychain tests work. CODE_SIGNING_ALLOWED=NO strips them and Keychain calls fail with -34018.
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project ios/Shoo.xcodeproj \
            -scheme Shoo \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee build.log | grep -E ": error: |\*\* (BUILD|TEST BUILD) (SUCCEEDED|FAILED)" || { tail -40 build.log; exit 1; }

      # tar keeps the executable bits and symlinks that upload-artifact would drop.
      - name: Pack the test build
        run: tar -czf test-build.tgz -C DerivedData Build/Products

      - uses: actions/upload-artifact@v4
        with:
          name: ios-test-build
          path: test-build.tgz
          retention-days: 1

  test:
    needs: build
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        kind: [unit, ui]
    # The UI suite takes about 30 minutes on this runner; the unit tests a few.
    timeout-minutes: ${{ matrix.kind == 'ui' && 45 || 20 }}
    name: ${{ matrix.kind }}
    steps:
      # Unit tests compare Data/Fixtures with contracts/fixtures by source path, so the repo is checked out
      # at the same path the build job compiled from.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ios-test-build

      - name: Unpack the test build
        id: build
        run: |
          mkdir -p DerivedData
          tar -xzf test-build.tgz -C DerivedData
          echo "xctestrun=$(find DerivedData/Build/Products -name '*.xctestrun' | head -1)" >> "$GITHUB_OUTPUT"

      # By UDID, not by name: two runtimes can both have an "iPhone 17 Pro". Newest iOS runtime, first iPhone.
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list -j devices available | jq -r '
            [.devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-"))
              | (.key | capture("iOS-(?<a>[0-9]+)-(?<b>[0-9]+)") | [(.a | tonumber), (.b | tonumber)]) as $v
              | .value[] | select(.name | startswith("iPhone")) | {v: $v, udid, name}]
            | sort_by(.v) | reverse | first | "\(.udid) \(.name)"')
          echo "Simulator: $UDID"
          echo "udid=${UDID%% *}" >> "$GITHUB_OUTPUT"

      # The UI step stops before the job timeout, so a slow run still keeps its log and result bundle.
      - name: Test
        timeout-minutes: ${{ matrix.kind == 'ui' && 40 || 15 }}
        run: ios/ShooApp/ci/run-tests.sh ${{ matrix.kind }} "${{ steps.build.outputs.xctestrun }}" "${{ steps.sim.outputs.udid }}"

      # Mock data only (-UITestMock), so the result bundle is safe in a public repo.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcresult-${{ matrix.kind }}
          path: |
            results-${{ matrix.kind }}.xcresult
            xcodebuild-${{ matrix.kind }}.log
          retention-days: 7
