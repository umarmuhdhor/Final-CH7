# Backend CI/CD (TODO C2). Secrets + steps: backend/ci/README.md.
name: backend

on:
  pull_request:
    paths: ["backend/**"]
  push:
    branches: [main]
    paths: ["backend/**"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  # Never cancel a run on main: it may be in the middle of `supabase db push` or the deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/api/pnpm-lock.yaml
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Start local Supabase
        working-directory: backend/db
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,realtime,postgres-meta,supavisor
      - name: pgTAP
        working-directory: backend/db
        run: supabase test db
      - run: pnpm -C backend/api install --frozen-lockfile
      - run: pnpm -C backend/api typecheck
      - run: pnpm -C backend/api test
      # Bundles the Worker exactly as a deploy would (config, cron trigger, bindings), without uploading.
      - name: Worker build check
        working-directory: backend/api
        run: npx wrangler deploy --dry-run --outdir /tmp/shoo-worker
      # Secrets in the files of this commit (the CLI is free for any repo; the action needs a licence for orgs).
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks dir . --no-banner --redact

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/api/pnpm-lock.yaml
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Migrate cloud database
        working-directory: backend/db
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push
      - run: pnpm -C backend/api install --frozen-lockfile
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm -C backend/api run deploy
