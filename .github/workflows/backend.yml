# Backend CI/CD (TODO C2). Secrets + steps: backend/ci/README.md.
name: backend

on:
  pull_request:
    paths: ["backend/**"]
  push:
    branches: [main]
    paths: ["backend/**"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  # Never cancel a run on main: it may be in the middle of `supabase db push` or the deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/api/pnpm-lock.yaml
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.114.0
      - name: Start local Supabase
        working-directory: backend/db
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,realtime,postgres-meta,supavisor
      - name: pgTAP
        working-directory: backend/db
        run: supabase test db
      - run: pnpm -C backend/api install --frozen-lockfile
      - run: pnpm -C backend/api typecheck
      - run: pnpm -C backend/api test
      # Bundles the Worker exactly as a deploy would (config, cron trigger, bindings), without uploading.
      - name: Worker build check
        working-directory: backend/api
        run: npx wrangler deploy --dry-run --outdir /tmp/shoo-worker
      # Secrets in the files of this commit (the CLI is free for any repo; the action needs a licence for orgs).
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks dir . --no-banner --redact

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/api/pnpm-lock.yaml
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.114.0
      # Straight to the session pooler (port 5432; runners are IPv4-only). No `supabase link`:
      # it needs an access token that can also read the project's API secret keys (#68).
      - name: Migrate cloud database
        working-directory: backend/db
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL"
      - run: pnpm -C backend/api install --frozen-lockfile
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm -C backend/api run deploy
      # Admin dashboard (shoo-dashboard phase 05b X8, W14): one deploy line on its Sistem chart.
      # Service token with scope ops:deploy only. Never fails the deploy; without the secrets it is skipped.
      - name: Deploy marker
        continue-on-error: true
        env:
          DEPLOY_CLIENT_ID: ${{ secrets.SHOO_ADMIN_DEPLOY_CLIENT_ID }}
          DEPLOY_CLIENT_SECRET: ${{ secrets.SHOO_ADMIN_DEPLOY_CLIENT_SECRET }}
          SHOO_ADMIN_URL: ${{ vars.SHOO_ADMIN_URL }}
        run: |
          if [ -z "$DEPLOY_CLIENT_ID" ] || [ -z "$DEPLOY_CLIENT_SECRET" ] || [ -z "$SHOO_ADMIN_URL" ]; then
            echo "deploy marker skipped: SHOO_ADMIN_DEPLOY_CLIENT_ID/SECRET or vars.SHOO_ADMIN_URL not set"; exit 0
          fi
          if [[ ! "$SHOO_ADMIN_URL" =~ ^https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev$ ]]; then
            echo "deploy marker skipped: SHOO_ADMIN_URL must be https://<name>.<account>.workers.dev"; exit 0
          fi
          # Credentials go through a curl config on a file descriptor, never on the command line.
          code="$(curl -s -m 15 -o /dev/null -w '%{http_code}' \
            -K <(printf 'header = "CF-Access-Client-Id: %s"\nheader = "CF-Access-Client-Secret: %s"\n' "$DEPLOY_CLIENT_ID" "$DEPLOY_CLIENT_SECRET") \
            -H 'content-type: application/json' \
            --data "{\"service\":\"shoo-api\",\"sha\":\"$GITHUB_SHA\"}" \
            "$SHOO_ADMIN_URL/api/ops/deploy" || true)"
          echo "deploy marker: http $code"
