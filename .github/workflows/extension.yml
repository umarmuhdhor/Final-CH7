# Extension CI: Safari extension, Chrome extension and the detector they share. Nothing to deploy here:
# the Safari extension ships inside the app (TestFlight), the Chrome one is loaded by hand.
# Before this, a PR touching only these folders ran no check at all (#292 reached main untested).
name: extension

on:
  pull_request:
    paths: ["ios/ShooExtension/**", "chrome/**", "detector/**", ".github/workflows/extension.yml"]
  push:
    branches: [main]
    paths: ["ios/ShooExtension/**", "chrome/**", "detector/**", ".github/workflows/extension.yml"]

permissions:
  contents: read

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # No dependencies: plain `node --test`, as in each folder's CLAUDE.md.
      - run: node --test ios/ShooExtension/Tests/*.test.mjs
      - run: node --test chrome/test/*.test.mjs
      - run: node --test detector/test/*.test.mjs
      # detector.js (both extensions) and the files Chrome copies from Safari are generated: they must match their sources.
      - name: Generated files are up to date
        run: |
          bash detector/scripts/sync-to-extension.sh
          bash chrome/scripts/sync.sh
          git diff --exit-code || { echo "::error::Run detector/scripts/sync-to-extension.sh and chrome/scripts/sync.sh, then commit."; exit 1; }
      # Same scan as backend.yml, here so a finding is caught on the PR and not on main's backend deploy.
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir ios/ShooExtension --no-banner --redact
          "$RUNNER_TEMP/gitleaks" dir chrome --no-banner --redact
          "$RUNNER_TEMP/gitleaks" dir detector --no-banner --redact
