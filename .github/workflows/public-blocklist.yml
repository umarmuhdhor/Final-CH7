# Pre-built /public-blocklist (M5-A, D-imelda-38): downloads Phishing.Database, builds every answer the Worker can give
# and writes them to Workers KV, because the Worker cannot build 200,000 entries within its 10 ms CPU limit.
# Setup (KV namespace, token, variables): ai/README.md "Pre-built list (Workers KV)". Skipped until the variable is set.
name: public-blocklist

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 h, the extension's refresh interval
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-blocklist
  # Never cancel a build half-way: meta is written last, but two builds must not interleave.
  cancel-in-progress: false

jobs:
  build:
    if: vars.BLOCKLIST_KV_NAMESPACE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build list and write to Workers KV
        env:
          BLOCKLIST_CF_API_TOKEN: ${{ secrets.BLOCKLIST_CF_API_TOKEN }}
          BLOCKLIST_CF_ACCOUNT_ID: ${{ secrets.BLOCKLIST_CF_ACCOUNT_ID }}
          BLOCKLIST_KV_NAMESPACE_ID: ${{ vars.BLOCKLIST_KV_NAMESPACE_ID }}
        run: node ai/scripts/build-blocklist.mjs
