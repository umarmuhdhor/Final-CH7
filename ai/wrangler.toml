# Cloudflare Worker for the Shoo AI service (/analyze, /public-blocklist). Nothing is deployed by committing this file.
# Deploy is a manual step: see plan/imelda/log/fase-08.md. Secrets (LLM_*) are set with `wrangler secret put`, never written here.
name = "shoo-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Privacy (SECURITY A4): no request logs. The code never logs URL, text, form, IP or token; turn the platform's own logs off too.
[observability]
enabled = false

[observability.logs]
invocation_logs = false

# workers.dev stays on (the default) so the first deploy has a URL. With a custom domain, set workers_dev = false and preview_urls = false.
# Zone-level HTTP logs / Logpush on a custom domain are NOT covered by the setting above; check them in the dashboard (A4).
# Cost bound (A3/A9): the Free plan already caps CPU at 10 ms; on Paid add  [limits] cpu_ms = 50  once real timings are known.

# Per-IP rate limit shared by all isolates (Workers Rate Limiting binding; works on workers.dev, unlike WAF zone rules).
# The in-memory limiter in src/app.js stays as a second layer and is the only one in tests and the dev server.
# period may only be 10 or 60 s. namespace_id: any number unique within the Cloudflare account.
[[ratelimits]]
name = "ANALYZE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "BLOCKLIST_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# Pre-built /public-blocklist (D-imelda-38): written every 6 h by .github/workflows/public-blocklist.yml, only read here.
# Without this binding the Worker serves an empty list. Namespace "shoo-public-blocklist", created once with
# `npx wrangler kv namespace create shoo-public-blocklist` (ai/README.md "Pre-built list"). The id is not a secret.
[[kv_namespaces]]
binding = "BLOCKLIST_KV"
id = "c0d0b3975fbd4f22a979a8baa8069d1d"

# RDAP cache shared by all isolates (D-imelda-40): key `rdap:<registrable domain>`, value { registeredAt } only.
# Separate namespace: the blocklist build owns every key in BLOCKLIST_KV. Without this binding the cache stays in memory.
# Namespace "shoo-rdap-cache", created with `npx wrangler kv namespace create shoo-rdap-cache`. The id is not a secret.
[[kv_namespaces]]
binding = "RDAP_KV"
id = "5ab0aaecad5b4194b252a755076b2dbb"
