# Cloudflare Worker for the Shoo AI service (/analyze, /public-blocklist). Nothing is deployed by committing this file.
# Deploy is a manual step: see plan/imelda/log/fase-08.md. Secrets (LLM_*) are set with `wrangler secret put`, never written here.
name = "shoo-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Privacy (SECURITY A4): no request logs. The code never logs URL, text, form, IP or token; turn the platform's own logs off too.
[observability]
enabled = false

[observability.logs]
invocation_logs = false

# workers.dev stays on (the default) so the first deploy has a URL. With a custom domain, set workers_dev = false and preview_urls = false.
# Zone-level HTTP logs / Logpush on a custom domain are NOT covered by the setting above; check them in the dashboard (A4).
# Cost bound (A3/A9): the Free plan already caps CPU at 10 ms; on Paid add  [limits] cpu_ms = 50  once real timings are known.
