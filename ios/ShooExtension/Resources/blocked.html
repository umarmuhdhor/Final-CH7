<!doctype html>
<!-- Owner: lead. Block screen (EX-06). Extension page: websites can't script it, so there's no bypass.
     Look: Figma "Safari / Blocked / Protected" and "Safari / Blocked / Guardian or pribadi". -->
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Shoo</title>
    <link rel="stylesheet" href="blocked.css">
</head>
<body>
    <main class="screen" hidden>
        <div class="top">
            <div class="brand">
                <img src="images/icon-96.png" alt="">
                <span>Shoo!</span>
            </div>
            <div class="ring" aria-hidden="true"><span class="score-value"></span></div>

            <div class="copy">
                <span class="chip link"></span>
                <h1 data-text="title"></h1>
                <p class="reasons"></p>
            </div>

            <section class="waiting" hidden>
                <div class="spinner" aria-hidden="true"></div>
                <p class="waiting-text"></p>
                <p class="hint" data-text="autoOpen"></p>
            </section>

            <p class="verified" hidden></p>
        </div>

        <div class="actions">
            <a class="button" hidden></a>
            <button class="back" type="button" data-text="back"></button>
        </div>
    </main>
    <script src="block.js"></script>
    <script src="blocked-page.js"></script>
</body>
</html>
