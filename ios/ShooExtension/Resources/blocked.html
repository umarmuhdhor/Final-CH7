<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Shoo</title>
    <link rel="stylesheet" href="blocked.css">
</head>
<body>
    <main class="screen" hidden>
        <div class="top">
            <div class="head">
                <img class="logo" src="images/shoo-logo.png" alt="Shoo" width="107.67" height="36">

                <div class="meter">
                    <div class="shield" aria-hidden="true"><img src="images/shield-red.png" alt=""></div>
                    <div class="score">
                        <div class="bar" aria-hidden="true"></div>
                        <span class="score-value"></span>
                    </div>
                </div>
            </div>

            <div class="copy">
                <span class="chip link"></span>
                <p class="lookalike" hidden></p>
                <h1 data-text="title"></h1>
                <p class="reasons"></p>
                <p class="verified" hidden></p>
            </div>
        </div>

        <div class="actions">
            <a class="button" hidden></a>
            <button class="back" type="button" data-text="back"></button>
        </div>
    </main>
    <script src="gauge.js"></script>
    <script src="block.js"></script>
    <script src="blocked-page.js"></script>
