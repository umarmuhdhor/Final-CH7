<!doctype html>
<!-- Owner: lead. Block screen (EX-06). Extension page: websites can't script it, so there's no bypass.
     Look: Figma "Safari / Blocked / Protected" (UI Pop Up Safari). -->
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Shoo</title>
    <link rel="stylesheet" href="blocked.css">
</head>
<body>
    <main class="screen" hidden>
        <div class="brand">
            <img src="images/shoo-shield-red.svg" alt="" width="16" height="16">
            <span>Shoo!</span>
        </div>

        <div class="top">
            <div class="gauge">
                <div class="gauge-art" aria-hidden="true"></div>
                <p class="score-value"></p>
                <p class="score-label" data-text="level"></p>
            </div>

            <div class="copy">
                <span class="chip link"></span>
                <h1 data-text="title"></h1>
                <p class="reasons"></p>
            </div>
        </div>

        <p class="verified" hidden></p>

        <div class="sent" hidden>
            <span class="avatar" aria-hidden="true"></span>
            <span class="sent-text"></span>
        </div>

        <div class="actions">
            <a class="button" hidden></a>
            <button class="back" type="button" data-text="back"></button>
        </div>
    </main>
    <script src="gauge.js"></script>
    <script src="block.js"></script>
    <script src="blocked-page.js"></script>
</body>
</html>
