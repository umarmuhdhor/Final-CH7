# Owner: lead. Generates Shoo.xcodeproj — run `xcodegen` in ios/ after changes.
# Never commit Shoo.xcodeproj (gitignored). This file is the only source of truth.
name: Shoo

options:
  bundleIdPrefix: com.shoo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Team ID, bundle ID and App Group come from here so each developer can sign with their own
# Apple account via Config/Local.xcconfig (gitignored). Don't set them in `settings` below —
# project settings override this file.
configFiles:
  Debug: Config/Shoo.xcconfig
  Release: Config/Shoo.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only (iPad/Mac out of scope)
    CODE_SIGN_STYLE: Automatic

targets:
  Shoo:
    type: application
    platform: iOS
    sources:
      - path: ShooApp
        excludes: ["CLAUDE.md", "Tests/**", "UITests/**", "ci/**"]
      - path: ShooShared
        excludes: ["CLAUDE.md", "Tests/**"]
    info:
      path: ShooApp/Info.plist
      properties:
        CFBundleDisplayName: Shoo
        ShooAppGroup: $(SHOO_APP_GROUP)   # read by ShooShared/AppGroup.swift
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true    # EX-03
        CFBundleURLTypes:                 # PR-03 invite link: shoo://join?code=1234
          - CFBundleURLName: com.shoo.app
            CFBundleURLSchemes: [shoo]
    entitlements:
      path: ShooApp/Shoo.entitlements
      properties:
        com.apple.security.application-groups: [$(SHOO_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SHOO_BUNDLE_ID)
    dependencies:
      - target: ShooExtension
      - target: ShooLiveActivity

  ShooExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShooExtension
        excludes: ["CLAUDE.md", "Resources/**", "Tests/**", "scripts/**"]
      # Web extension files must sit flat at the bundle root (same as Xcode's template)…
      - path: ShooExtension/Resources
        excludes: ["_locales/**", "images/**"]
        buildPhase: resources
      # …except these, which keep their folder structure.
      - path: ShooExtension/Resources/_locales
        type: folder
      - path: ShooExtension/Resources/images
        type: folder
      - path: ShooShared
        excludes: ["CLAUDE.md", "Tests/**"]
    info:
      path: ShooExtension/Info.plist
      properties:
        CFBundleDisplayName: Shoo
        ShooAppGroup: $(SHOO_APP_GROUP)   # read by ShooShared/AppGroup.swift
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: ShooExtension/ShooExtension.entitlements
      properties:
        com.apple.security.application-groups: [$(SHOO_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SHOO_BUNDLE_ID).extension
    dependencies:
      - sdk: SafariServices.framework

  ShooLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: ShooLiveActivity
        excludes: ["CLAUDE.md"]
      - path: ShooShared
        excludes: ["CLAUDE.md", "Tests/**"]
    info:
      path: ShooLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Shoo
        ShooAppGroup: $(SHOO_APP_GROUP)   # read by ShooShared/AppGroup.swift
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ShooLiveActivity/ShooLiveActivity.entitlements
      properties:
        com.apple.security.application-groups: [$(SHOO_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SHOO_BUNDLE_ID).liveactivity
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  ShooAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ShooApp/Tests, ShooShared/Tests]
    dependencies:
      - target: Shoo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  ShooAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ShooApp/UITests]
    dependencies:
      - target: Shoo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Shoo:
    build:
      targets:
        Shoo: all
    run:
      config: Debug
    test:
      targets:
        - ShooAppTests
        - ShooAppUITests
